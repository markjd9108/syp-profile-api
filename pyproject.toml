[project]
name = "tpl-profile-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "reportlab>=5.0.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tpl-api-server = "api_server:main"

[tool.hatch.build.targets.wheel      ]
packages = ["api_server"]