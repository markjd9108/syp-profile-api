    var p = document.body || document.documentElement;

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: url(\"2ccdac19-e00d-470e-80d6-3128928873c9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"27a2db25-760a-42d5-b57b-19aa74eaf69a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ============================================================\n   COLOR TOKENS \u2014 The Performance Lens\n   Navy dominates (60\u201370% of any layout). Bright blue is a\n   sharp accent, used sparingly and never for body text.\n   ============================================================ */\n:root {\n  /* --- Base palette (brand guidelines, canonical) --- */\n  --navy-900: #0A1645;   /* Anchor \u2014 headings & structure. Dominant colour. */\n  --navy-800: #0E2A47;   /* Raised navy \u2014 applied in print deliverables. */\n  --navy-700: #15315A;   /* Hover / pressed navy surfaces. */\n  --blue-500: #2979FF;   /* Bright Blue \u2014 accent only: rules, links, highlights. */\n  --blue-600: #1D4ED8;   /* Strong accent \u2014 buttons, pressed links. */\n  --blue-300: #7FB0FF;   /* Muted accent for type on navy. */\n  --ink-900:  #1A1A2E;   /* Near-Black Ink \u2014 body text, warmer than pure black. */\n  --grey-50:  #F5F6F8;   /* Light Grey \u2014 section backgrounds, calm & separation. */\n  --callout:  #EAF1FE;   /* Pale-blue callout band. */\n  --white:    #FFFFFF;\n\n  /* --- Derived neutrals --- */\n  --slate-600: #5B6678;  /* Muted body / secondary text. */\n  --slate-400: #8C97A8;  /* Captions, meta, disabled. */\n  --rule-200:  #DCE1EA;  /* Hairline rules & borders. */\n  --rule-300:  #C6CDDA;  /* Stronger dividers. */\n\n  /* --- Semantic surfaces --- */\n  --surface-page:    var(--white);\n  --surface-section: var(--grey-50);\n  --surface-callout: var(--callout);\n  --surface-navy:    var(--navy-900);\n  --surface-card:    var(--white);\n\n  /* --- Semantic text --- */\n  --text-heading:  var(--navy-900);\n  --text-body:     var(--ink-900);\n  --text-muted:    var(--slate-600);\n  --text-faint:    var(--slate-400);\n  --text-label:    var(--blue-500);   /* tracked small-caps section labels */\n  --on-navy:       var(--white);\n  --on-navy-muted: var(--blue-300);\n\n  /* --- Semantic accents --- */\n  --accent:        var(--blue-500);\n  --accent-strong: var(--blue-600);\n  --accent-line:   var(--blue-500);   /* callout left borders, rules */\n\n  /* --- Borders --- */\n  --border-hairline: var(--rule-200);\n  --border-divider:  var(--rule-300);\n  --border-strong:   var(--navy-900);\n\n  /* --- Status (data / gauges) --- */\n  --scale-foundation: #E5533C;  /* lowest band */\n  --scale-emerging:   #F5A623;\n  --scale-developing: #2E7DF6;\n  --scale-strong:     #34D399;  /* highest band */\n  --positive: #1E8E5A;          /* \"reach for it\" */\n  --warning:  #C0492B;          /* \"what breaks it\" */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TYPOGRAPHY TOKENS \u2014 The Performance Lens\n   Display  : heavy condensed geometric sans (Saira Condensed)\n   Heading  : same spirit, mid weight (Saira SemiCondensed)\n   Body     : neutral humanist grotesque (Archivo)\n   Label    : tracked small-caps, bright blue\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-display: \"Saira Condensed\", \"Arial Narrow\", system-ui, sans-serif;\n  --font-heading: \"Saira SemiCondensed\", \"Saira Condensed\", system-ui, sans-serif;\n  --font-body:    \"Archivo\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n\n  /* --- Weights --- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n  --fw-extra:   800;  /* @kind font */\n  --fw-black:   900;  /* @kind font */\n\n  /* --- Type scale (from brand guidelines spec) --- */\n  --fs-display: 72px;   /* Covers, hero */\n  --fs-h1:      46px;   /* Page / section titles */\n  --fs-h2:      30px;   /* Subsection headings */\n  --fs-h3:      22px;   /* Subheads */\n  --fs-lead:    19px;   /* Lead paragraph */\n  --fs-body:    17px;   /* Running text */\n  --fs-small:   15px;   /* Secondary text */\n  --fs-caption: 13px;   /* Captions */\n  --fs-label:   12px;   /* Tracked small-caps labels */\n\n  /* --- Line heights --- */\n  --lh-tight:   1.02;   /* @kind font */\n  --lh-snug:    1.12;   /* @kind font */\n  --lh-normal:  1.55;   /* @kind font */\n  --lh-relaxed: 1.7;    /* @kind font */\n\n  /* --- Letter spacing --- */\n  --ls-display: -0.01em; /* @kind font */\n  --ls-heading: 0;       /* @kind font */\n  --ls-body:    0;        /* @kind font */\n  --ls-label:   0.18em;  /* @kind font */\n  --ls-pill:    0.14em;  /* @kind font */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SPACING, RADII & LAYOUT TOKENS \u2014 The Performance Lens\n   Generous white space, crisp rules, near-square corners.\n   4px base unit.\n   ============================================================ */\n:root {\n  /* --- Spacing scale (4px base) --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* --- Radii \u2014 crisp, near-square; pills fully round --- */\n  --radius-xs: 2px;\n  --radius-sm: 4px;\n  --radius-md: 6px;\n  --radius-lg: 10px;\n  --radius-pill: 999px;\n\n  /* --- Hairline / rule weights --- */\n  --rule-thin: 1px;\n  --rule-accent: 3px;   /* callout left border */\n  --rule-heavy: 4px;\n\n  /* --- Layout --- */\n  --page-max: 1120px;\n  --doc-max: 816px;     /* document column (~US Letter content width) */\n  --gutter: 48px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   ELEVATION & MOTION TOKENS \u2014 The Performance Lens\n   Restrained, editorial. Cards lean on hairline rules more\n   than shadow. No glow, no heavy drop shadows.\n   ============================================================ */\n:root {\n  /* --- Shadows --- */\n  --shadow-none: none;\n  --shadow-xs: 0 1px 2px rgba(10, 22, 69, 0.06);\n  --shadow-sm: 0 2px 8px rgba(10, 22, 69, 0.07);\n  --shadow-md: 0 6px 20px rgba(10, 22, 69, 0.10);\n  --shadow-lg: 0 16px 40px rgba(10, 22, 69, 0.14);\n\n  /* --- Motion --- */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur-base: 200ms;  /* @kind other */\n  --dur-slow: 320ms;  /* @kind other */\n\n  /* --- Focus ring --- */\n  --focus-ring: 0 0 0 3px rgba(41, 121, 255, 0.35);\n}\n<\u002Fstyle>\n<style>/* The Performance Lens \u2014 Design System\n   Global entry point. Consumers link this one file.\n   Keep this as @import lines only. */\n/* ============================================================\n   FONTS \u2014 The Performance Lens\n   ------------------------------------------------------------\n   SUBSTITUTION NOTE: The brand's display face is \"a heavy\n   geometric sans, drawn from the wordmark\" and is marked\n   PROPOSED \u2014 PENDING CONFIRMATION in the brand guidelines.\n   Until the production typeface is licensed and supplied,\n   this system uses Google Fonts as the nearest match:\n\n     \u2022 Saira Condensed  -> heavy condensed DISPLAY headings\n     \u2022 Saira SemiCondensed -> section HEADINGS / subheads\n     \u2022 Archivo          -> neo-grotesque BOD C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"27a2db25-760a-42d5-b57b-19aa74eaf69a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   COLOR TOKENS \u2014 The Performance Lens\n   Navy dominates (60\u201370% of any layout). Bright blue is a\n   sharp accent, used sparingly and never for body text.\n   ============================================================ */\n:root {\n  /* --- Base palette (brand guidelines, canonical) --- */\n  --navy-900: #0A1645;   /* Anchor \u2014 headings & structure. Dominant colour. */\n  --navy-800: #0E2A47;   /* Raised navy \u2014 applied in print deliverables. */\n  --navy-700: #15315A;   /* Hover / pressed navy surfaces. */\n  --blue-500: #2979FF;   /* Bright Blue \u2014 accent only: rules, links, highlights. */\n  --blue-600: #1D4ED8;   /* Strong accent \u2014 buttons, pressed links. */\n  --blue-300: #7FB0FF;   /* Muted accent for type on navy. */\n  --ink-900:  #1A1A2E;   /* Near-Black Ink \u2014 body text, warmer than pure black. */\n  --grey-50:  #F5F6F8;   /* Light Grey \u2014 section backgrounds, calm & separation. */\n  --callout:  #EAF1FE;   /* Pale-blue callout band. */\n  --white:    #FFFFFF;\n\n  /* --- Derived neutrals --- */\n  --slate-600: #5B6678;  /* Muted body / secondary text. */\n  --slate-400: #8C97A8;  /* Captions, meta, disabled. */\n  --rule-200:  #DCE1EA;  /* Hairline rules & borders. */\n  --rule-300:  #C6CDDA;  /* Stronger dividers. */\n\n  /* --- Semantic surfaces --- */\n  --surface-page:    var(--white);\n  --surface-section: var(--grey-50);\n  --surface-callout: var(--callout);\n  --surface-navy:    var(--navy-900);\n  --surface-card:    var(--white);\n\n  /* --- Semantic text --- */\n  --text-heading:  var(--navy-900);\n  --text-body:     var(--ink-900);\n  --text-muted:    var(--slate-600);\n  --text-faint:    var(--slate-400);\n  --text-label:    var(--blue-500);   /* tracked small-caps section labels */\n  --on-navy:       var(--white);\n  --on-navy-muted: var(--blue-300);\n\n  /* --- Semantic accents --- */\n  --accent:        var(--blue-500);\n  --accent-strong: var(--blue-600);\n  --accent-line:   var(--blue-500);   /* callout left borders, rules */\n\n  /* --- Borders --- */\n  --border-hairline: var(--rule-200);\n  --border-divider:  var(--rule-300);\n  --border-strong:   var(--navy-900);\n\n  /* --- Status (data / gauges) --- */\n  --scale-foundation: #E5533C;  /* lowest band */\n  --scale-emerging:   #F5A623;\n  --scale-developing: #2E7DF6;\n  --scale-strong:     #34D399;  /* highest band */\n  --positive: #1E8E5A;          /* \"reach for it\" */\n  --warning:  #C0492B;          /* \"what breaks it\" */\n}\n\n/* ============================================================\n   TYPOGRAPHY TOKENS \u2014 The Performance Lens\n   Display  : heavy condensed geometric sans (Saira Condensed)\n   Heading  : same spirit, mid weight (Saira SemiCondensed)\n   Body     : neutral humanist grotesque (Archivo)\n   Label    : tracked small-caps, bright blue\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-display: \"Saira Condensed\", \"Arial Narrow\", system-ui, sans-serif;\n  --font-heading: \"Saira SemiCondensed\", \"Saira Condensed\", system-ui, sans-serif;\n  --font-body:    \"Archivo\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n\n  /* --- Weights --- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n  --fw-extra:   800;  /* @kind font */\n  --fw-black:   900;  /* @kind font */\n\n  /* --- Type scale (from brand guidelines spec) --- */\n  --fs-display: 72px;   /* Covers, hero */\n  --fs-h1:      46px;   /* Page / section titles */\n  --fs-h2:      30px;   /* Subsection headings */\n  --fs-h3:      22px;   /* Subheads */\n  --fs-lead:    19px;   /* Lead paragraph */\n  --fs-body:    17px;   /* Running text */\n  --fs-small:   15px;   /* Secondary text */\n  --fs-caption: 13px;   /* Captions */\n  --fs-label:   12px;   /* Tracked small-caps labels */\n\n  /* --- Line heights --- */\n  --lh-tight:   1.02;   /* @kind font */\n  --lh-snug:    1.12;   /* @kind font */\n  --lh-normal:  1.55;   /* @kind font */\n  --lh-relaxed: 1.7;    /* @kind font */\n\n  /* --- Letter spacing --- */\n  --ls-display: -0.01em; /* @kind font */\n  --ls-heading: 0;       /* @kind font */\n  --ls-body:    0;        /* @kind font */\n  --ls-label:   0.18em;  /* @kind font */\n  --ls-pill:    0.14em;  /* @kind font */\n}\n\n/* ============================================================\n   SPACING, RADII & LAYOUT TOKENS \u2014 The Performance Lens\n   Generous white space, crisp rules, near-square corners.\n   4px base unit.\n   ============================================================ */\n:root {\n  /* --- Spacing scale (4px base) --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* --- Radii \u2014 crisp, near-square; pills fully round --- */\n  --radius-xs: 2px;\n  --radius-sm: 4px;\n  --radius-md: 6px;\n  --radius-lg: 10px;\n  --radius-pill: 999px;\n\n  /* --- Hairline / rule weights --- */\n  --rule-thin: 1px;\n  --rule-accent: 3px;   /* callout left border */\n  --rule-heavy: 4px;\n\n  /* --- Layout --- */\n  --page-max: 1120px;\n  --doc-max: 816px;     /* document column (~US Letter content width) */\n  --gutter: 48px;\n}\n\n/* ============================================================\n   ELEVATION & MOTION TOKENS \u2014 The Performance Lens\n   Restrained, editorial. Cards lean on hairline rules more\n   than shadow. No glow, no heavy drop shadows.\n   ============================================================ */\n:root {\n  /* --- Shadows --- */\n  --shadow-none: none;\n  --shadow-xs: 0 1px 2px rgba(10, 22, 69, 0.06);\n  --shadow-sm: 0 2px 8px rgba(10, 22, 69, 0.07);\n  --shadow-md: 0 6px 20px rgba(10, 22, 69, 0.10);\n  --shadow-lg: 0 16px 40px rgba(10, 22, 69, 0.14);\n\n  /* --- Motion --- */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur-base: 200ms;  /* @kind other */\n  --dur-slow: 320ms;  /* @kind other */\n\n  /* --- Focus ring --- */\n  --focus-ring: 0 0 0 3px rgba(41, 121, 255, 0.35);\n}\n\n<\u002Fstyle>\n<script src=\"532ca49e-48e0-41f4-82dd-100ac4983849\"><\u002Fscript>\n<style>\n  body { margin:0; background:#E6E9EF; }\n  a { color: var(--blue-600); text-decoration: none; }\n  a:hover { color: var(--navy-900); }\n  @page { size: A4; margin: 0; }\n  @media print {\n    body { background:#fff; }\n    .desk { background:#fff !important; padding:0 !important; gap:0 !important; }\n    .page { box-shadow:none !important; margin:0 !important; page-break-after: always; break-after: page; }\n    .page:last-child { page-break-after: auto; break-after: auto; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div class=\"desk\" style=\"background:#E6E9EF;padding:40px 0;display:flex;flex-direction:column;align-items:center;gap:32px;font-family:var(--font-body);color:var(--text-body)\">\n\n  <!-- ============ PAGE 1 \u2014 COVER ============ -->\n  <div class=\"page\" data-screen-label=\"01 Cover\" style=\"width:794px;min-height:1123px;background:var(--navy-900);color:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.22);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:64px 68px\">\n    <div style=\"position:absolute;right:-160px;top:60px;width:520px;height:520px;border-radius:50%;border:1px solid rgba(127,176,255,0.10)\"><\u002Fdiv>\n    <div style=\"position:absolute;right:-60px;top:200px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(127,176,255,0.10)\"><\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;position:relative\">\n      <img src=\"6d117b33-90d5-427c-851f-d4f6c4b93ec3\" alt=\"The Performance Lens\" style=\"height:62px;width:auto;display:block\">\n      <span style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.24em;color:var(--blue-300);text-transform:uppercase\">Confidential<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.24em;color:var(--blue-300);text-transform:uppercase;margin-top:18px;position:relative\">Simulate \u00b7 Assess \u00b7 Develop<\u002Fdiv>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <div style=\"font-family:var(--font-body);font-weight:700;font-size:14px;letter-spacing:0.22em;color:var(--blue-300);text-transform:uppercase\">Team Effectiveness Workshop<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:900;font-size:82px;line-height:0.9;letter-spacing:-0.005em;color:#fff;margin:20px 0 0;text-transform:none\">Leadership<br>Insight Report<\u002Fh1>\n      <div style=\"width:72px;height:5px;background:var(--blue-500);margin-top:26px;border-radius:2px\"><\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;gap:44px;margin-top:52px\">\n        <div>\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.22em;color:var(--blue-300);text-transform:uppercase;margin-bottom:8px\">Team<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;color:#fff\">{{ team }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;height:52px;background:rgba(127,176,255,0.3)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.22em;color:var(--blue-300);text-transform:uppercase;margin-bottom:10px\">Workshop Date<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;color:#fff\">{{ date }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.22em;color:var(--blue-300);text-transform:uppercase;margin-bottom:10px\">Prepared For<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;color:#fff\">{{ leaderName }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n\n    <div style=\"border-top:1px solid rgba(127,176,255,0.28);padding-top:20px;display:flex;justify-content:space-between;align-items:center;position:relative\">\n      <span style=\"font-family:var(--font-body);font-size:13px;color:var(--blue-300)\">Human skills for a digital future.<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;color:rgba(255,255,255,0.7);text-transform:uppercase\">Not for distribution<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 2 \u2014 THE ONE-PAGE READ ============ -->\n  <div class=\"page\" data-screen-label=\"01b The Method\" style=\"width:794px;min-height:1123px;background:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.12);display:flex;flex-direction:column\">\n    <div style=\"padding:44px 60px 0\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.RunningHeader\" doc-name=\"Team Effectiveness Workshop\" brand=\"Leadership Insight Report\" section=\"Confidential\" hint-size=\"100%,32px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"padding:28px 60px 20px;flex:1\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.SectionLabel\" hint-size=\"140px,16px\">How This Is Measured<\u002Fx-import>\n      <h2 style=\"font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--navy-900);margin:6px 0 16px;line-height:1\">Where these results come from<\u002Fh2>\n\n      <p style=\"font-family:var(--font-body);font-size:14.5px;line-height:1.6;color:var(--text-body);margin:0 0 22px;text-wrap:pretty\">This report is built from a structured team assessment, not opinion or observation on the day. Every member completed the same set of role-based exercises, and the results were scored against researched patterns of how effective teams communicate, decide, and work together. The method is the reason the findings on the following pages can be trusted and acted on.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px\">\n        <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:16px 18px\"><div style=\"margin-bottom:9px;height:22px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l8.5 4.5L12 12 3.5 7.5 12 3z\" stroke=\"var(--navy-900)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M4 12l8 4.3 8-4.3\" stroke=\"var(--blue-500)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M4 16.3l8 4.2 8-4.2\" stroke=\"var(--blue-500)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--navy-900);margin-bottom:6px\">Three dimensions<\u002Fdiv><p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0;text-wrap:pretty\">Every person is measured on Communication, Decision-Making, and Collaboration \u2014 the three behaviours that most determine how a team performs under pressure.<\u002Fp><\u002Fdiv>\n        <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:16px 18px\"><div style=\"margin-bottom:9px;height:22px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"9\" cy=\"8\" r=\"3.2\" stroke=\"var(--navy-900)\" stroke-width=\"1.5\"/><path d=\"M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5\" stroke=\"var(--navy-900)\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><path d=\"M16 5.2a3.2 3.2 0 0 1 0 6\" stroke=\"var(--blue-500)\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><path d=\"M17 14.2c2.3.5 4 2.4 4 4.8\" stroke=\"var(--blue-500)\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\u002Fsvg><\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--navy-900);margin-bottom:6px\">Peer and self<\u002Fdiv><p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0;text-wrap:pretty\">Each member rates their own approach and the teammates they worked alongside. Scores combine both views, so the picture reflects the whole team, not just one person's view of themselves.<\u002Fp><\u002Fdiv>\n        <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:16px 18px\"><div style=\"margin-bottom:9px;height:22px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l7 2.5v5.5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V5.5L12 3z\" stroke=\"var(--navy-900)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M9 12l2 2 4-4\" stroke=\"var(--blue-500)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--navy-900);margin-bottom:6px\">Research-backed<\u002Fdiv><p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0;text-wrap:pretty\">Scoring and archetypes are grounded in established models of team effectiveness and behavioural assessment \u2014 the same patterns used in organisational performance research.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start\">\n        <div>\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--slate-600);margin-bottom:10px\">How a score becomes a band<\u002Fdiv>\n          <p style=\"font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--text-body);margin:0 0 12px;text-wrap:pretty\">Raw responses are normalised to a 0\u2013100 scale for each person's role, which lets everyone be compared fairly. Each result is then reported in one of four plain-language bands, so the report reads as behaviour, not test scores.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:11px;height:11px;border-radius:50%;background:var(--scale-strong);flex:none\"><\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;color:var(--navy-900);width:96px\">Strong<\u002Fspan><span style=\"font-family:var(--font-body);font-size:12px;color:var(--text-muted)\">Demonstrable strength under pressure.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:11px;height:11px;border-radius:50%;background:var(--scale-developing);flex:none\"><\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;color:var(--navy-900);width:96px\">Developing<\u002Fspan><span style=\"font-family:var(--font-body);font-size:12px;color:var(--text-muted)\">Working capability, room to grow.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:11px;height:11px;border-radius:50%;background:var(--scale-emerging);flex:none\"><\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;color:var(--navy-900);width:96px\">Emerging<\u002Fspan><span style=\"font-family:var(--font-body);font-size:12px;color:var(--text-muted)\">A development priority; focus moves it quickly.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:11px;height:11px;border-radius:50%;background:var(--scale-foundation);flex:none\"><\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;color:var(--navy-900);width:96px\">Foundation<\u002Fspan><span style=\"font-family:var(--font-body);font-size:12px;color:var(--text-muted)\">Early stage; structured attention recommended.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--grey-50);border-radius:6px;padding:18px 20px\">\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--slate-600);margin-bottom:8px\">What this is, and is not<\u002Fdiv>\n          <p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.55;color:var(--text-body);margin:0;text-wrap:pretty\">This is a snapshot of how the team behaved in one structured session, built to open the right conversations. It is a reliable starting point for development \u2014 not a final or fixed judgement of any individual.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 60px 30px\">\n      <div style=\"border-top:1px solid var(--rule-200);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-600);font-weight:600\">The Performance Lens<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--slate-400);margin-top:3px\">Human skills for a digital future.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-400);font-weight:600\">Page 2 of {{ totalPages }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"page\" data-screen-label=\"02 The One-Page Read\" style=\"width:794px;min-height:1123px;background:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.12);display:flex;flex-direction:column\">\n    <div style=\"padding:44px 60px 0\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.RunningHeader\" doc-name=\"Team Effectiveness Workshop\" brand=\"Leadership Insight Report\" section=\"Confidential\" hint-size=\"100%,32px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"padding:28px 60px 20px;flex:1\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.SectionLabel\" hint-size=\"120px,16px\">The One-Page Read<\u002Fx-import>\n      <h2 style=\"font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--navy-900);margin:6px 0 22px;line-height:1\">Where your team stands<\u002Fh2>\n\n      <!-- Element 1: personal verdict -->\n      <div style=\"background:var(--navy-900);color:#fff;border-radius:6px;padding:26px 30px\">\n        <div style=\"font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--blue-300)\">For {{ leaderName }}<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:16px;line-height:1.55;color:#fff;margin:12px 0 0;text-wrap:pretty\">{{ leaderVerdict }}<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Element 2: at-a-glance grid -->\n color:var(--text-body);margin:0;text-wrap:pretty\">{{ checkInFallback }}<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n\n        <sc-if value=\"{{ b.caveat }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-left:3px solid var(--rule-300);padding:4px 0 4px 18px;margin-top:24px\">\n          <p style=\"font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--text-muted);margin:0;text-wrap:pretty\">This picture is a snapshot of behaviour under structured pressure, one data point. Use it to open conversations.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:0 60px 30px\">\n      <div style=\"border-top:1px solid var(--rule-200);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-600);font-weight:600\">The Performance Lens<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--slate-400);margin-top:3px\">Human skills for a digital future.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-400);font-weight:600\">Page {{ pg.num }} of {{ totalPages }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <!-- ============ PAGE 6 \u2014 ACTION PLAN ============ -->\n  <div class=\"page\" data-screen-label=\"06 Action Plan\" style=\"width:794px;min-height:1123px;background:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.12);display:flex;flex-direction:column\">\n    <div style=\"padding:44px 60px 0\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.RunningHeader\" doc-name=\"Team Effectiveness Workshop\" brand=\"Leadership Insight Report\" section=\"Confidential\" hint-size=\"100%,32px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"padding:28px 60px 20px;flex:1\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.SectionLabel\" hint-size=\"120px,16px\">Action Plan<\u002Fx-import>\n      <h2 style=\"font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--navy-900);margin:6px 0 14px;line-height:1\">Ordered by the risks in your data<\u002Fh2>\n\n      <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text-muted);margin:0 0 24px;text-wrap:pretty\">These options are ordered by the risks in this team's data. They are best practices to adapt, and the sequencing is yours: you know the team's calendar and context.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ risks }}\" as=\"risk\" hint-placeholder-count=\"2\">\n          <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:24px 26px\">\n            <div style=\"display:flex;align-items:baseline;gap:14px\">\n              <span style=\"font-family:var(--font-display);font-weight:900;font-size:24px;color:var(--blue-500);line-height:1;font-variant-numeric:tabular-nums\">{{ risk.num }}<\u002Fspan>\n              <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:21px;color:var(--navy-900);margin:0;line-height:1.1\">{{ risk.title }}<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text-body);margin:12px 0 16px;text-wrap:pretty\">{{ risk.statement }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ risk.moves }}\" as=\"move\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start\">\n                  <span style=\"color:var(--blue-500);font-weight:700;line-height:1.5\">\u2192<\u002Fspan>\n                  <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-body);margin:0;text-wrap:pretty\">{{ move }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-200)\">\n              <p style=\"font-family:var(--font-body);font-style:italic;font-size:13.5px;line-height:1.5;color:var(--text-muted);margin:0;text-wrap:pretty\">You will know this is moving when {{ risk.observable }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 60px 30px\">\n      <div style=\"border-top:1px solid var(--rule-200);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-600);font-weight:600\">The Performance Lens<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--slate-400);margin-top:3px\">Human skills for a digital future.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-400);font-weight:600\">Page {{ pg6Num }} of {{ totalPages }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 7 \u2014 WHAT TO EXPECT NEXT ============ -->\n  <div class=\"page\" data-screen-label=\"07 What to Expect Next\" style=\"width:794px;min-height:1123px;background:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.12);display:flex;flex-direction:column\">\n    <div style=\"padding:44px 60px 0\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.RunningHeader\" doc-name=\"Team Effectiveness Workshop\" brand=\"Leadership Insight Report\" section=\"Confidential\" hint-size=\"100%,32px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"padding:28px 60px 20px;flex:1\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.SectionLabel\" hint-size=\"120px,16px\">What to Expect Next<\u002Fx-import>\n      <h2 style=\"font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--navy-900);margin:6px 0 20px;line-height:1\">The path from here<\u002Fh2>\n\n      <!-- Part 1: included next steps -->\n      <div style=\"border-left:3px solid var(--blue-500);background:var(--grey-50);padding:20px 24px\">\n        <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--blue-600);margin-bottom:10px\">Already included with this workshop<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.6;color:var(--ink-900);margin:0;text-wrap:pretty\">Your 60-minute leadership debrief happens within ten days of the workshop. That is where we walk this report together: the team pattern, the focus conversations, and how to run the first moves. A week-12 check-in follows, a short call to review what has shifted and what needs adjusting. The debrief walks through the core pages of this report.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <div style=\"font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--blue-600);margin-bottom:6px\">Two ways to go further<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text-body);margin:0;text-wrap:pretty\">Beyond the debrief already included, these are two optional paths to keep the team developing. Choose based on whether you want measured progress tracked over time, or one fast, focused lift on the priority now.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px\">\n        <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column\"><div style=\"font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--slate-600)\">Ongoing \u00b7 Comparative<\u002Fdiv><h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:19px;color:var(--navy-900);margin:8px 0 11px;line-height:1.1\">Annual Performance Program<\u002Fh3><p style=\"font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--text-body);margin:0 0 12px;text-wrap:pretty\">A 12-month program built on this workshop. This session is your baseline; a re-assessment at month 12 re-runs the same scenarios and shows exactly how far the team has moved, dimension by dimension \u2014 with three focused sessions in between to build the priority areas.<\u002Fp><p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0 0 14px;text-wrap:pretty\"><strong style=\"color:var(--navy-900)\">Best for:<\u002Fstrong> leaders who want proof the team is developing, measured over time.<\u002Fp><div style=\"margin-top:auto\"><span style=\"font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--blue-600)\">Explore the annual program &rarr;<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #CBD3E1;box-shadow:0 1px 3px rgba(16,30,61,0.08),0 1px 2px rgba(16,30,61,0.05);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column\"><div style=\"font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--slate-600)\">Targeted \u00b7 90 Minutes<\u002Fdiv><h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:19px;color:var(--navy-900);margin:8px 0 11px;line-height:1.1\">A Focused Session<\u002Fh3><p style=\"font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--text-body);margin:0 0 12px;text-wrap:pretty\">A single 90-minute session aimed straight at this team's edge: making thinking visible before it becomes a decision. Same pressure-and-play format as the workshop \u2014 no lectures, no assessment. A fast lift on communication and decision-making.<\u002Fp><p style=\"font-family:var(--font-body);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0 0 14px;text-wrap:pretty\"><strong style=\"color:var(--navy-900)\">Best for:<\u002Fstrong> teams who want one concentrated push on the priority, now.<\u002Fp><div style=\"margin-top:auto\"><span style=\"font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--blue-600)\">Book a focused session &rarr;<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Part 3: closing verdict -->\n      <div style=\"background:var(--navy-900);color:#fff;border-radius:6px;padding:26px 30px;margin-top:20px\">\n        <div style=\"font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--blue-300)\">The Work Ahead<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:16px;line-height:1.55;color:#fff;margin:12px 0 0;text-wrap:pretty\">{{ closingVerdict }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.Button\" variant=\"accent\" size=\"lg\" href=\"#\" hint-size=\"280px,52px\">Talk to us about next steps \u2192<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 60px 30px\">\n      <div style=\"border-top:1px solid var(--rule-200);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-600);font-weight:600\">The Performance Lens<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--slate-400);margin-top:3px\">Human skills for a digital future.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-400);font-weight:600\">Page {{ pg7Num }} of {{ totalPages }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 8 \u2014 APPENDIX ============ -->\n  <div class=\"page\" data-screen-label=\"08 Appendix\" style=\"width:794px;min-height:1123px;background:#fff;box-sizing:border-box;box-shadow:0 3px 26px rgba(10,22,69,0.12);display:flex;flex-direction:column\">\n    <div style=\"padding:44px 60px 0\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.RunningHeader\" doc-name=\"Team Effectiveness Workshop\" brand=\"Leadership Insight Report\" section=\"Confidential\" hint-size=\"100%,32px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"padding:28px 60px 20px;flex:1\">\n      <x-import component-from-global-scope=\"ThePerformanceLensDesignSystem_4a127a.SectionLabel\" hint-size=\"120px,16px\">Appendix \u00b7 Method &amp; Reference<\u002Fx-import>\n      <h2 style=\"font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--navy-900);margin:6px 0 22px;line-height:1\">Method and reference<\u002Fh2>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--navy-900);margin:0 0 10px\">How results are generated<\u002Fh3>\n          <p style=\"font-family:var(--font-body);font-size:13.5px;line-height:1.6;color:var(--text-body);margin:0;text-wrap:pretty\">Each person was scored across six exercises in three rotating roles, from structured self- and peer assessment captured throughout the workshop: each participant assesses their own behaviour and that of teammates. Results are normalised for each person's role-specific question set, which allows comparison across participants who played different roles, and reported in four bands. The exercises run without telling people what good looks like, so they surface natural defaults: who clarifies before acting, who commits when the brief is unclear, who holds steady when a plan breaks.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--navy-900);margin:0 0 10px\">How archetypes are assigned<\u002Fh3>\n          <p style=\"font-family:var(--font-body);font-size:13.5px;line-height:1.6;color:var(--text-body);margin:0;text-wrap:pretty\">Archetypes are not assigned by a single highest result. The method evaluates the pattern of results across all three dimensions. An archetype describes a dominant operating mode under pressure. It is behavioural, it is observable, and it changes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:30px\">\n        <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--navy-900);margin:0 0 14px\">Score bands reference<\u002Fh3>\n        <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;font-family:var(--font-body)\">\n          <tbody>\n            <tr>\n                <td style=\"padding:13px 14px 13px 0;border-bottom:1px solid var(--rule-200);white-space:nowrap;vertical-align:top;width:1%\">\n                  <span style=\"display:inline-flex;align-items:center;gap:9px\">\n                    <span style=\"{{ b.dotStyle }}\"><\u002Fspan>\n                    <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;color:var(--navy-900)\">{{ b.band }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Ftd>\n                \n                <td style=\"padding:13px 0;border-bottom:1px solid var(--rule-200);vertical-align:top;font-size:13.5px;line-height:1.5;color:var(--text-body)\">{{ b.desc }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n        <p style=\"font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--text-muted);margin:14px 0 0;text-wrap:pretty\">Each member sees these same bands in their individual profile. This report is the team layer: the collective picture across all three dimensions.<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ compInAppendix }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:20px\">\n        <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--navy-900);margin:0 0 10px\">Team composition<\u002Fh3>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-family:var(--font-body)\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-600);font-weight:700;padding:0 10px 7px 0;border-bottom:1px solid var(--rule-300)\">Archetype<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:center;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-600);font-weight:700;padding:0 10px 7px;border-bottom:1px solid var(--rule-300)\">Count<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-600);font-weight:700;padding:0 0 7px 10px;border-bottom:1px solid var(--rule-300)\">Members<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ archetypes }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <sc-raw-tr>\n                <sc-raw-td style=\"padding:5px 10px 5px 0;border-bottom:1px solid var(--rule-200);font-weight:700;font-size:12px;color:var(--navy-900)\">{{ a.arch }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:5px 10px;border-bottom:1px solid var(--rule-200);text-align:center;font-weight:700;font-size:12px;color:var(--navy-900);font-variant-numeric:tabular-nums\">{{ a.count }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:5px 0 5px 10px;border-bottom:1px solid var(--rule-200);font-size:11.5px;color:var(--text-muted)\">{{ a.members }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:20px\">\n        <h3 style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--navy-900);margin:0 0 14px\">Focus groups<\u002Fh3>\n        <p style=\"font-family:var(--font-body);font-size:13.5px;line-height:1.55;color:var(--text-body);margin:0;text-wrap:pretty\">Check-In marks members with at least one dimension below the 60 working threshold. These are the members whose 1:1 this quarter is worth planning. Every other member appears in the team table without a flag.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:34px;border-top:1px solid var(--rule-200);padding-top:16px\">\n        <p style=\"font-family:var(--font-body);font-size:12.5px;color:var(--slate-600);margin:0\">Report prepared for {{ leaderName }} \u00b7 {{ team }} \u00b7 {{ date }}<\u002Fp>\n        <p style=\"font-family:var(--font-body);font-size:12.5px;color:var(--slate-400);margin:6px 0 0\">Confidential. Not for distribution beyond the named leader.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 60px 30px\">\n      <div style=\"border-top:1px solid var(--rule-200);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-600);font-weight:600\">The Performance Lens<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--slate-400);margin-top:3px\">Human skills for a digital future.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--slate-400);font-weight:600\">Page {{ pg8Num }} of {{ totalPages }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  cell(v, top) {\n    const flag = v < 60;\n    const pad = top ? 'padding:13px 6px;vertical-align:top;' : 'padding:11px 8px;';\n    const base = pad + 'text-align:center;font-variant-numeric:tabular-nums;font-size:14px;border-bottom:1px solid var(--rule-200);';\n    return base + (flag\n      ? 'color:#8A5200;font-weight:800;background:#FBEFD6;'\n      : 'color:var(--navy-900);font-weight:600;');\n  }\n  flagStyle(flag) {\n    const amber = 'background:#FBEFD6;color:#8A5200;';\n    const blue = 'background:var(--callout);color:var(--blue-600);';\n    return 'display:inline-block;font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:0.06em;padding:3px 10px;border-radius:999px;' + (flag === 'Stretch' ? blue : amber);\n  }\n  bar(score) {\n    return 'height:100%;width:' + score + '%;background:var(--navy-900);border-radius:3px;';\n  }\n  renderVals() {\n    const cfg = window.__LIR_PAYLOAD__;\n    if (!cfg || !Array.isArray(cfg.members)) { throw new Error('LIR payload missing or invalid'); }\n\n    // CO2: bands-only. Payload dim values are band words, rendered as\n    // colour-dot chips; below-threshold bands carry amber text (legend intact).\n    const BCOLOR = { 'Strong': 'var(--scale-strong)', 'Developing': 'var(--scale-developing)',\n                     'Emerging': 'var(--scale-emerging)', 'Foundation': 'var(--scale-foundation)' };\n    const BLOW = { 'Strong': false, 'Developing': false, 'Emerging': true, 'Foundation': true };\n    const bdot = (b, sz) => 'width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;flex:none;background:' + (BCOLOR[b] || 'var(--rule-300)') + ';';\n    const btxt = b => 'font-size:10.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:' + (BCOLOR[b] || 'var(--navy-900)') + ';';\n    const members = cfg.members.map(m => ({\n      ...m,\n      commDot: bdot(m.comm, 9), commTxt: btxt(m.comm),\n      dmDot: bdot(m.dm, 9), dmTxt: btxt(m.dm),\n      collabDot: bdot(m.collab, 9), collabTxt: btxt(m.collab),\n      flagStyle: m.flag === 'Steady' ? 'display:none' : this.flagStyle(m.flag),\n    }));\n    const _supDims = [['Communication','comm'],['Decision-Making','dm'],['Collaboration','collab']];\n    const _supCounts = _supDims.map(d => [d[0], members.filter(m => BLOW[m[d[1]]]).length]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);\n    const supportLine = _supCounts.length\n      ? (_supCounts.map(x => x[0]).slice(0,2).join(' and ') + ' need the most attention. ' + _supCounts[0][1] + (_supCounts[0][1]===1 ? ' member sits' : ' members sit') + ' below the working threshold in ' + _supCounts[0][0].toLowerCase() + '. The individual rows below show where.')\n      : 'Every member is at or above the working threshold on all three dimensions.';\n    const checkInMembers = members.filter(m => m.flag === 'Check-In').map(m => ({ ...m, theme: m.focusTheme }));\n    const stretchMembers = members.filter(m => m.flag === 'Stretch').map(m => ({ ...m, theme: m.stretchTheme }));\n\n    const order = []; const amap = {};\n    cfg.members.forEach(m => { if (!amap[m.archetype]) { amap[m.archetype] = []; order.push(m.archetype); } amap[m.archetype].push(m.name); });\n    const archetypes = order.map(a => ({ arch: a, count: amap[a].length, members: amap[a].join(', ') }));\n\n    const BPCT = { 'Foundation': 18, 'Emerging': 45, 'Developing': 72, 'Strong': 95 };\n    const cards = cfg.cards.map(c => ({ ...c, barStyle: this.bar(BPCT[c.band] || 0), dotStyle: bdot(c.band, 12) }));\n    const hasMissing = Array.isArray(cfg.missingCards) && cfg.missingCards.length > 0;\n    const splitPage4 = cfg.patternCards.length >= 4 && hasMissing;\n    const inlineMissingFlag = cfg.patternCards.length < 4 && hasMissing;\n    const patternGridCols = cfg.patternCards.length <= 3 ? ('repeat(' + cfg.patternCards.length + ',1fr)') : '1fr 1fr';\n\n    const bands = [\n      { band: 'Strong', desc: 'Demonstrable strength under pressure.', dotStyle: 'width:11px;height:11px;border-radius:50%;background:var(--scale-strong);flex:none' },\n      { band: 'Developing', desc: 'Working capability, above the working threshold, with room to grow.', dotStyle: 'width:11px;height:11px;border-radius:50%;background:var(--scale-developing);flex:none' },\n      { band: 'Emerging', desc: 'A development priority. Targeted focus here moves the needle quickly.', dotStyle: 'width:11px;height:11px;border-radius:50%;background:var(--scale-emerging);flex:none' },\n      { band: 'Foundation', desc: 'Foundational stage. Structured attention recommended.', dotStyle: 'width:11px;height:11px;border-radius:50%;background:var(--scale-foundation);flex:none' },\n    ];\n\n    // ---- Who Is Who pagination (Change Order 1 \u00a76.2) --------------------\n    const n = members.length;\n    // CO2: \"the team in one view\" means ONE page. Compact rows hold up to 14\n    // members with the legend; at 9+ the composition grid moves to the appendix.\n    const compOnP3 = n <= 8;\n    const compInAppendix = n > 8;\n    const wiwChunks = [];\n    if (n <= 14) { wiwChunks.push(members.slice()); }\n    else {\n      const rest = members.slice();\n      wiwChunks.push(rest.splice(0, 14));\n      while (rest.length > 12) { wiwChunks.push(rest.splice(0, Math.min(16, rest.length - 6))); }\n      if (rest.length) wiwChunks.push(rest);\n    }\n\n    // ---- Page 5 pagination ------------------------------------------------\n    // Pixel budget per page (content region below the section label; the\n    // first page also carries the h2 + locked intro). Costs are conservative\n    // estimates per block; the endpoint's A4 fit check backstops them.\n    const themeShort = !!cfg.themeShort;\n    const ROW = themeShort ? 68 : 90;      // themed table row\n    const HEADER = 52, THEAD = 36, FALLBACK = 90, CAVEAT = 80;\n    const CAP_FIRST = 780, CAP_CONT = 880;\n    const p5Raw = [];\n    let cur = { blocks: [], used: 0, cap: CAP_FIRST };\n    const newPage = () => { p5Raw.push(cur); cur = { blocks: [], used: 0, cap: CAP_CONT }; };\n    const ensure = (cost) => { if (cur.used + cost > cur.cap && cur.blocks.length) newPage(); };\n    const pushHeader = (kind) => { ensure(HEADER + THEAD + ROW); cur.blocks.push({ [kind + 'Header']: true }); cur.used += HEADER; };\n    const pushRows = (kind, rows) => {\n      let i = 0;\n      while (i < rows.length) {\n        if (cur.used + THEAD + ROW > cur.cap) newPage();\n        const avail = Math.max(1, Math.floor((cur.cap - cur.used - THEAD) / ROW));\n        const take = rows.slice(i, i + avail);\n        cur.blocks.push({ [kind + 'Table']: true, rows: take });\n        cur.used += THEAD + take.length * ROW;\n        i += take.length;\n      }\n    };\n    const pushFallback = (kind) => { ensure(FALLBACK); cur.blocks.push({ [kind + 'Fallback']: true }); cur.used += FALLBACK; };\n    pushHeader('ci');\n    if (checkInMembers.length) pushRows('ci', checkInMembers); else pushFallback('ci');\n    if (cur.used + CAVEAT > cur.cap) newPage();\n    cur.blocks.push({ caveat: true }); cur.used += CAVEAT;\n    p5Raw.push(cur);\n\n    // ---- Page numbering ---------------------------------------------------\n    const wiwStart = 4;\n    const pg4Num = wiwStart + wiwChunks.length;\n    const pg4bNum = pg4Num + 1;\n    const p5Start = pg4Num + 1 + (splitPage4 ? 1 : 0);\n    const pg6Num = p5Start + p5Raw.length;\n    const pg7Num = pg6Num + 1;\n    const pg8Num = pg7Num + 1;\n    const totalPages = pg8Num;\n\n    const wiwPages = wiwChunks.map((rows, i) => ({\n      rows, first: i === 0, cont: i > 0, last: i === wiwChunks.length - 1, num: wiwStart + i,\n    }));\n    const p5Pages = p5Raw.map((p, i) => ({\n      blocks: p.blocks, first: i === 0, cont: i > 0, num: p5Start + i,\n    }));\n\n    return {\n      team: cfg.team, date: cfg.date, leaderName: cfg.leaderName,\n      leaderVerdict: cfg.leaderVerdict,\n      workingWell: cfg.workingWell, needsSupport: cfg.needsSupport,\n      teamRisk: cfg.teamRisk, teamOpportunity: cfg.teamOpportunity,\n      cards, priorityDim: cfg.priorityDim, firstMove: cfg.firstMove,\n      members, avgComm: cfg.avgComm, avgDm: cfg.avgDm, avgCollab: cfg.avgCollab,\n      avgCommDot: bdot(cfg.avgComm, 9), avgCommTxt: btxt(cfg.avgComm),\n      avgDmDot: bdot(cfg.avgDm, 9), avgDmTxt: btxt(cfg.avgDm),\n      avgCollabDot: bdot(cfg.avgCollab, 9), avgCollabTxt: btxt(cfg.avgCollab),\n      isSmallTeam: cfg.members.length <= 5, supportLine,\n      archetypes, compOnP3, compInAppendix,\n      patternLabel: cfg.patternLabel, patternTitle: cfg.patternTitle, definingPatternP1: cfg.definingPatternP1, definingPatternP2: cfg.definingPatternP2,\n      patternCards: cfg.patternCards, missingCards: cfg.missingCards,\n      splitPage4, inlineMissing: inlineMissingFlag, patternGridCols,\n      checkInMembers, stretchMembers,\n      checkInCount: checkInMembers.length, stretchCount: stretchMembers.length, teamSize: members.length,\n      hasCheckIn: checkInMembers.length > 0, noCheckIn: checkInMembers.length === 0,\n      hasStretch: stretchMembers.length > 0, noStretch: stretchMembers.length === 0,\n      stretchFallback: checkInMembers.length === members.length ? \"No members sit in the Stretch group this round. When every member flags on at least one dimension, the pattern belongs to the team as a whole. The Action Plan on the next page is built around it.\" : \"No members sit in the Stretch group this round.\",\n      checkInFallback: stretchMembers.length === members.length ? \"No members sit in the Check-In group this round. When every member clears the threshold on every dimension, the work ahead is stretch, and the Action Plan on the next page is built around it.\" : \"No members sit in the Check-In group this round.\",\n      oneToWatch: cfg.priorityBelow\n        ? 'The one to watch: ' + cfg.priorityDim + ' \\u2014 at ' + cfg.priorityBand + ' today; the work is bringing it to Developing by re-assessment.'\n        : 'The one to watch: ' + cfg.priorityDim + ' \\u2014 the dimension with the most room at re-assessment.',\n      risks: cfg.risks, prescription: cfg.prescription, closingVerdict: cfg.closingVerdict,\n      bands,\n      wiwPages, p5Pages, totalPages, pg4Num, pg4bNum, pg6Num, pg7Num, pg8Num,\n    };\n  }\n\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
